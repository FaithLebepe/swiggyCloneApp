<ion-header>
  <ion-toolbar>
    <ion-title><ion-label color="dark">MANAGE ADDRESSES</ion-label></ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/account"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content color="light">

  @if (isLoading) {
    <div class="ion-text-center alignSpinner">
      <ion-spinner color="primary"></ion-spinner>
    </div>
  }

  @if(!isLoading){
  <ion-list>
    <ion-item-divider>SAVED ADDRESSES</ion-item-divider>
    <ion-item-group class="ion-padding">
      @for (address of addresses; track $index) {
      <ion-item lines="none" class="ion-no-padding">
        <ion-icon [name]="getIcon(address?.title)" color="medium" slot="start" class="ion-align-self-start"></ion-icon>
        <ion-label>
          <ion-label class="ion-padding-bottom">{{ address?.title }}</ion-label>
          <ion-text color="medium">
            <p class="ion-text-wrap">
              {{ address?.house }} {{ address?.landmark }} {{ address?.address }}
            </p>
          </ion-text>
          <ion-row>
            <ion-button fill="clear" color="primary" (click)="editAddress()">EDIT</ion-button>
            <ion-button fill="clear" color="primary" (click)="deleteAddress()">DELETE</ion-button>
          </ion-row>
        </ion-label>
      </ion-item>
    }
      
    </ion-item-group>
  </ion-list>
}
</ion-content>

<ion-footer>
  <ion-toolbar color="light">
    <ion-button fill="outline" color="success" expand="block" class="ion-margin-horizontal">ADD NEW ADDRESS</ion-button>
  </ion-toolbar>
</ion-footer>
