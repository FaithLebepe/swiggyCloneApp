<ion-header>
  <ion-toolbar color="primary">
    <ion-title>My Account</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="logout()">
        <ion-icon name="power-outline" color="white" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  @if (isLoading) {
    <div class="ion-text-center alignSpinner">
      <ion-spinner color="primary"></ion-spinner>
    </div>
  }
  
  @if (!isLoading) {
    <ion-list class="borderBottomSmall">
      <ion-item lines="full">
        <ion-button slot="end" fill="clear">EDIT</ion-button>
        <ion-label>
          <ion-text class="ion-text-uppercase"><h4>Faith Lebepe</h4></ion-text>
          <p>{{ profile?.phone }} | {{ profile?.email }} </p>
        </ion-label>
      </ion-item>

      <ion-item detail="true" [routerLink]="['/', 'address']">
        <ion-icon slot="start" color="dark" name="home-outline"></ion-icon>
        <h5>Manage Addresses</h5>
      </ion-item>
    </ion-list>

    <ion-list>
      <ion-list-header>
        <ion-label color="primary">PAST ORDERS</ion-label>
      </ion-list-header>

      @if (!orders || orders?.length == 0) {
        <ion-text class="ion-text-center">
          <p>No Orders Placed Yet</p>
        </ion-text>
      }

      @for (order of orders; track $index) {
        <app-orders 
        [order]="order"
        (reorder)="reorder($event)"
        (help)="getHelp($event)"></app-orders>
      }
    </ion-list>
  }
</ion-content>
