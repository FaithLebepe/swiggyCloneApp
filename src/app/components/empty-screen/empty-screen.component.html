<ion-grid>
  <ion-row class="ion-justify-content-center">
    <ion-col size="12" size-md="6" class="ion-text-center">
      <ion-icon 
        [name]="model?.icon ? model?.icon : 'cart-outline'"
        [color]="model?.color ? model?.color : 'tertiary'"></ion-icon>
    </ion-col>
  </ion-row>
  <ion-row class="ion-justify-content-center">
    <ion-col size="12" size-md="6" class="ion-text-center">
      <ion-label>{{model?.title ? model?.title : 'Your Cart is Empty'}}</ion-label>
      @if (model?.subTitle) {
        <ion-text>
          <p>{{model?.subTitle}}</p>
        </ion-text>
      }
    </ion-col>
  </ion-row>
</ion-grid>
