<ion-row>
    <div>
      <swiper-container 
      [modules]="swiperModules"
      [slidesPerView]="1.2" 
      [spaceBetween]="20"
      [pagination]="{clickable: true, dynamicBullets:true}"
      >@for(image of bannerImages; track $index){
        <swiper-slide>
          <img [src]="image?.banner">
        </swiper-slide>
        
      }
        
      </swiper-container>
    </div>
  </ion-row>
