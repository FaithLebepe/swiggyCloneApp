<ion-item>
  <ion-text>
    <span class="dotStyle">&#9679;</span>
  </ion-text>
  <ion-label class="ion-text-wrap">
    <h4>{{ item?.name }}</h4>
  </ion-label>
  <ion-row>
    <ion-icon color="success" name="remove-outline" (click)="removeFromCart()"></ion-icon>
    <ion-text color="success" class="ion-text-center quantity"> {{ item?.quantity }}</ion-text>
    <ion-icon color="success" name="add-outline" (click)="addToCart()"></ion-icon>
  </ion-row>
  <ion-text slot="end" color="dark" class="ion-text-right price">
    <h5>R{{ item?.price * item?.quantity | number:'1.2-2'}}</h5>
    </ion-text>
</ion-item>
